<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>04 Difficulty Select</title>
  <rect width="1440" height="900" fill="#0b0f14"/>
  
  <text x="120" y="96" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#f2b90c" font-weight="700" text-anchor="start" letter-spacing="1.8">MAIN STORAGE HALL</text>
  <text x="120" y="138" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="30" fill="#e9eef4" font-weight="800" text-anchor="start">Choose difficulty</text>
  <text x="120" y="168" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#97a4b2" font-weight="400" text-anchor="start">Difficulty changes the clock, the lighting, the number of decoys and whether hazards move.</text>

  <rect x="120" y="220" width="380" height="380" rx="12" fill="#121820" stroke="#2a323b" stroke-width="1"/>
  <rect x="120" y="220" width="5" height="380" rx="3" fill="#22c55e"/>
  <text x="150" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="24" fill="#e9eef4" font-weight="800" text-anchor="start">Simple</text>
  <text x="150" y="302" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">Obvious hazards, generous time, strong</text>
  <text x="150" y="320.75" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">guidance.</text>
  <rect x="150" y="350" width="115.69999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="160" y="364" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">90 s per hazard</text>
  <rect x="150" y="384" width="83.8" height="23" rx="999" fill="#1e2630"/>
  <text x="160" y="398" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">×1.0 score</text>
  <rect x="150" y="418" width="141.21999999999997" height="23" rx="999" fill="#1e2630"/>
  <text x="160" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">Hazards highlighted</text>
  <rect x="150" y="452" width="71.03999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="160" y="466" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">0 decoys</text>
  
  <rect x="150" y="528" width="320" height="44" rx="8" fill="#f2b90c" stroke="none" stroke-width="1"/>
  <text x="310" y="555.4" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#1a1204" font-weight="800" text-anchor="middle">Start Simple</text>
  <rect x="524" y="220" width="380" height="380" rx="12" fill="#121820" stroke="#2a323b" stroke-width="1"/>
  <rect x="524" y="220" width="5" height="380" rx="3" fill="#f2b90c"/>
  <text x="554" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="24" fill="#e9eef4" font-weight="800" text-anchor="start">Mid</text>
  <text x="554" y="302" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">Standard time, moderate distractions, no</text>
  <text x="554" y="320.75" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">highlights.</text>
  <rect x="554" y="350" width="115.69999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="564" y="364" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">60 s per hazard</text>
  <rect x="554" y="384" width="90.17999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="564" y="398" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">×1.25 score</text>
  <rect x="554" y="418" width="102.94" height="23" rx="999" fill="#1e2630"/>
  <text x="564" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">No highlights</text>
  <rect x="554" y="452" width="71.03999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="564" y="466" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">6 decoys</text>
  <rect x="554" y="486" width="109.32" height="23" rx="999" fill="#1e2630"/>
  <text x="564" y="500" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">Moving hazards</text>
  
  <rect x="554" y="528" width="320" height="44" rx="8" fill="#1b232c" stroke="#2a323b" stroke-width="1"/>
  <text x="714" y="555.4" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef4" font-weight="600" text-anchor="middle">Start Mid</text>
  <rect x="928" y="220" width="380" height="380" rx="12" fill="#121820" stroke="#2a323b" stroke-width="1"/>
  <rect x="928" y="220" width="5" height="380" rx="3" fill="#ef4444"/>
  <text x="958" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="24" fill="#e9eef4" font-weight="800" text-anchor="start">Hard</text>
  <text x="958" y="302" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">Subtle hazards, short clock, heavy</text>
  <text x="958" y="320.75" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">distractions, dim light.</text>
  <rect x="958" y="350" width="115.69999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="968" y="364" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">38 s per hazard</text>
  <rect x="958" y="384" width="83.8" height="23" rx="999" fill="#1e2630"/>
  <text x="968" y="398" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">×1.6 score</text>
  <rect x="958" y="418" width="96.55999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="968" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">Count hidden</text>
  <rect x="958" y="452" width="77.41999999999999" height="23" rx="999" fill="#1e2630"/>
  <text x="968" y="466" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">12 decoys</text>
  <rect x="958" y="486" width="109.32" height="23" rx="999" fill="#1e2630"/>
  <text x="968" y="500" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#97a4b2" font-weight="700" text-anchor="start">Moving hazards</text>
  
  <rect x="958" y="528" width="320" height="44" rx="8" fill="#1b232c" stroke="#2a323b" stroke-width="1"/>
  <text x="1118" y="555.4" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef4" font-weight="600" text-anchor="middle">Start Hard</text>

  <text x="120" y="660" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#97a4b2" font-weight="600" text-anchor="start">← Back</text>

</svg>