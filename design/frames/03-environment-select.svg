  <text x="956" y="350.75" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">lighting, heavy congestion. All 15 hazards,</text>
  <text x="956" y="369.5" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">harder to see.</text>
