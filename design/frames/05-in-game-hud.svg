<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>05 In-Game HUD</title>
  <rect width="1440" height="900" fill="#20262d"/>
  
  <!-- warehouse stand-in: the real frame shows the 3D view -->
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#20262d"/>
  <rect x="0" y="470" width="1440" height="430" rx="0" fill="#6f767d"/>
  <rect x="300" y="470" width="240" height="430" rx="0" fill="#1f8a4c" opacity="0.85"/>
  <rect x="300" y="470" width="8" height="430" rx="0" fill="#dedede"/>
  <rect x="532" y="470" width="8" height="430" rx="0" fill="#dedede"/>
  <rect x="720" y="470" width="6" height="430" rx="0" fill="#e8c000"/>
  <rect x="60" y="150" width="60" height="330" rx="0" fill="#c2521a"/>
  <rect x="60" y="210" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="60" y="320" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="96" y="150" width="190" height="58" rx="0" fill="#c69a63"/>
  <rect x="96" y="258" width="190" height="58" rx="0" fill="#b98d58"/>
  <rect x="390" y="150" width="60" height="330" rx="0" fill="#c2521a"/>
  <rect x="390" y="210" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="390" y="320" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="426" y="150" width="190" height="58" rx="0" fill="#c69a63"/>
  <rect x="426" y="258" width="190" height="58" rx="0" fill="#b98d58"/>
  <rect x="720" y="150" width="60" height="330" rx="0" fill="#c2521a"/>
  <rect x="720" y="210" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="720" y="320" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="756" y="150" width="190" height="58" rx="0" fill="#c69a63"/>
  <rect x="756" y="258" width="190" height="58" rx="0" fill="#b98d58"/>
  <rect x="1050" y="150" width="60" height="330" rx="0" fill="#c2521a"/>
  <rect x="1050" y="210" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="1050" y="320" width="250" height="16" rx="0" fill="#1f4e9c"/>
  <rect x="1086" y="150" width="190" height="58" rx="0" fill="#c69a63"/>
  <rect x="1086" y="258" width="190" height="58" rx="0" fill="#b98d58"/>
  <rect x="0" y="0" width="1440" height="150" rx="0" fill="#161b21"/>

  <!-- top bar -->
  
  <rect x="24" y="24" width="110" height="58" rx="10" fill="#0a0e13cc" stroke="#2a323b" stroke-width="1"/>
  <text x="38" y="44" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#64717f" font-weight="700" text-anchor="start" letter-spacing="1.2">MODE</text>
  <text x="38" y="69" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#e9eef4" font-weight="800" text-anchor="start">TRAIN</text>
  
  <rect x="146" y="24" width="130" height="58" rx="10" fill="#0a0e13cc" stroke="#2a323b" stroke-width="1"/>
  <text x="160" y="44" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#64717f" font-weight="700" text-anchor="start" letter-spacing="1.2">DIFFICULTY</text>
  <text x="160" y="69" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#e9eef4" font-weight="800" text-anchor="start">Simple</text>
  
  <rect x="880" y="24" width="190" height="58" rx="10" fill="#0a0e13cc" stroke="#2a323b" stroke-width="1"/>
  <text x="894" y="44" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#64717f" font-weight="700" text-anchor="start" letter-spacing="1.2">HAZARDS FOUND</text>
  <text x="894" y="69" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#e9eef4" font-weight="800" text-anchor="start">4/15</text>
  <rect x="894" y="70" width="162" height="5" rx="3" fill="#ffffff22"/>
  <rect x="894" y="70" width="43" height="5" rx="3" fill="#f2b90c"/>
  
  <rect x="1082" y="24" width="130" height="58" rx="10" fill="#0a0e13cc" stroke="#2a323b" stroke-width="1"/>
  <text x="1096" y="44" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#64717f" font-weight="700" text-anchor="start" letter-spacing="1.2">SCORE</text>
  <text x="1096" y="69" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#f2b90c" font-weight="800" text-anchor="start">58</text>
  
  <rect x="1224" y="24" width="192" height="58" rx="10" fill="#0a0e13cc" stroke="#ef444488" stroke-width="1"/>
  <text x="1238" y="44" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#64717f" font-weight="700" text-anchor="start" letter-spacing="1.2">REACTION CLOCK</text>
  <text x="1238" y="69" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#ef4444" font-weight="800" text-anchor="start">00:12</text>

  <!-- combo badge -->
  <rect x="742" y="24" width="124" height="34" rx="999" fill="#ff8a1f"/>
  <text x="804" y="46" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1a1204" font-weight="900" text-anchor="middle">🔥 COMBO x4</text>

  <!-- reticle -->
  <line x1="720" y1="438" x2="720" y2="462" stroke="#f2b90c" stroke-width="2"/>
  <line x1="708" y1="450" x2="732" y2="450" stroke="#f2b90c" stroke-width="2"/>
  <circle cx="720" cy="450" r="3" fill="#f2b90c"/>
  <rect x="636" y="476" width="168" height="30" rx="8" fill="#0a0e13dd" stroke="#f2b90c" stroke-width="1"/>
  <text x="652" y="496" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#e9eef4" font-weight="700" text-anchor="start">Flag this hazard</text>
  <rect x="770" y="482" width="22" height="18" rx="4" fill="#f2b90c"/>
  <text x="781" y="496" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a1204" font-weight="900" text-anchor="middle">E</text>

  <!-- Train Mode panel -->
  <rect x="24" y="178" width="320" height="214" rx="12" fill="#121820" stroke="#2a323b" stroke-width="1"/>
  <text x="46" y="208" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#f2b90c" font-weight="800" text-anchor="start" letter-spacing="1.2">TRAINING · 4/15 LEARNED</text>
  <text x="46" y="236" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef4" font-weight="800" text-anchor="start">Find the next hazard</text>
  <text x="46" y="260" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#97a4b2" font-weight="400" text-anchor="start">Compare this pallet with the ones beside</text>
  <text x="46" y="278" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#97a4b2" font-weight="400" text-anchor="start">it. Look at the edges.</text>
  <rect x="46" y="306" width="190" height="26" rx="6" fill="#3a2f10"/>
  <text x="58" y="324" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#ffdf8a" font-weight="700" text-anchor="start">Unstable / falling boxes</text>
  <rect x="46" y="342" width="276" height="30" rx="8" fill="#3a2f1099"/>
  <text x="58" y="362" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#ffdf8a" font-weight="700" text-anchor="start">📍 Aisle C, north end — high up</text>

  <!-- feedback card -->
  <rect x="430" y="560" width="580" height="268" rx="12" fill="#121820" stroke="#2a323b" stroke-width="1"/>
  <rect x="430" y="560" width="5" height="268" rx="3" fill="#22c55e"/>
  <text x="462" y="596" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" fill="#e9eef4" font-weight="800" text-anchor="start">✓ Damaged / Leaning Racking</text>
  <rect x="752" y="582" width="51.9" height="23" rx="999" fill="#3a1418"/>
  <text x="762" y="596" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#ffb0b0" font-weight="700" text-anchor="start">MAJOR</text>
  <text x="980" y="598" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#22c55e" font-weight="900" text-anchor="end">+15</text>
  <text x="462" y="622" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#f2b90c" font-weight="700" text-anchor="start">📍 Aisle B, south end — at eye level</text>
  <text x="462" y="646" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">Damaged uprights lose a large part of their load capacity.</text>
  <text x="462" y="664.75" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#97a4b2" font-weight="400" text-anchor="start">Racking failure is progressive.</text>
  <rect x="462" y="682" width="520" height="52" rx="8" fill="#0d2a3a"/>
  <rect x="462" y="682" width="3" height="52" rx="0" fill="#38bdf8"/>
  <text x="478" y="702" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#cfe9fa" font-weight="400" text-anchor="start">Safe practice: report and barrier off impact damage immediately,</text>
  <text x="478" y="719.25" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#cfe9fa" font-weight="400" text-anchor="start">and off-load the bay.</text>
  <line x1="462" y1="750" x2="982" y2="750" stroke="#2a323b" stroke-width="1"/>
  <text x="462" y="772" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#f2b90c" font-weight="800" text-anchor="start" letter-spacing="1.4">REMEMBER</text>
  <rect x="462" y="784" width="99.16999999999999" height="22.5" rx="999" fill="#f2b90c"/>
  <text x="472" y="797.5" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#1a1204" font-weight="700" text-anchor="start">impact damage</text>
  <rect x="594" y="784" width="111.35" height="22.5" rx="999" fill="#f2b90c"/>
  <text x="604" y="797.5" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#1a1204" font-weight="700" text-anchor="start">rack inspection</text>
  <rect x="726" y="784" width="111.35" height="22.5" rx="999" fill="#f2b90c"/>
  <text x="736" y="797.5" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#1a1204" font-weight="700" text-anchor="start">green-amber-red</text>
  <rect x="858" y="784" width="68.72" height="22.5" rx="999" fill="#f2b90c"/>
  <text x="868" y="797.5" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#1a1204" font-weight="700" text-anchor="start">off-load</text>

  <!-- controls hint -->
  <rect x="24" y="846" width="700" height="34" rx="8" fill="#0a0e1399" stroke="#2a323b" stroke-width="1"/>
  <text x="40" y="868" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" fill="#64717f" font-weight="400" text-anchor="start">W A S D  Move    Mouse  Look    Shift  Run    C  Crouch    E / Click  Flag hazard    Esc  Pause</text>

</svg>