# Builds the game and publishes it to GitHub Pages on every push to main.
#
# Publishes by pushing the built site to the `gh-pages` branch, rather than via
# the Pages deployment API. The API route (actions/configure-pages +
# actions/deploy-pages) needs the repository's Pages source to be set to
# "GitHub Actions" in Settings first, and the `enablement: true` option could
# not create the site on this repository - it failed with "Get Pages site
# failed ... Not Found". Pushing a gh-pages branch works without that manual
# step, and GitHub serves it automatically.
#
# Live at: https://kushalthewave.github.io/interprize-project/
#
# vite.config.js uses `base: './'`, so assets resolve correctly from the
# project subpath - no base override is needed here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needs write access to push the built site to the gh-pages branch.
permissions:
  contents: write

# Let a running publish finish rather than cancelling it part-way.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Do not publish a broken build.
      - name: Check syntax
        run: node scripts/syntax-check.mjs

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the standalone single-file version
        run: npm run build:single

      - name: Assemble the site
        run: |
          cp dist-single/beat-the-hazard.html dist/beat-the-hazard.html
          # The company marketing site is plain static HTML with no build
          # step, so it is copied in as-is and served from /company/.
          mkdir -p dist/company
          cp -r marketing/. dist/company/
          # Stop GitHub applying Jekyll processing to the built assets.
          touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
