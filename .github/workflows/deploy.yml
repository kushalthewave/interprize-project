# Builds the game and publishes it to GitHub Pages on every push to main.
#
# ONE-TIME MANUAL STEP: in the repository, go to
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is set, this workflow will build successfully but the deploy step
# will fail with "Pages site not found".
#
# Once enabled the game is live at:
#   https://kushalthewave.github.io/interprize-project/
#
# vite.config.js uses `base: './'`, so relative asset paths work correctly from
# a project subpath - no base override is needed here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node scripts/syntax-check.mjs

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build single-file version
        run: npm run build:single

      - name: Include the standalone single-file build in the site
        run: cp dist-single/beat-the-hazard.html dist/beat-the-hazard.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
