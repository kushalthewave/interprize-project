# Runs the test suite and build on pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checking out and testing needs nothing but read access. Without this block a
# workflow gets whatever the repository default happens to be, which is more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to point
      # at different code by whoever owns the action. The comment says which
      # release the commit is, so the pin can be read and updated by a human.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: node scripts/syntax-check.mjs
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

      # The game ships one runtime dependency, so an advisory against it
      # matters. Dev-only advisories are reported but do not fail the run,
      # because a build tool flaw is not shipped to a trainee's browser.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build dependencies (report only)
        run: npm audit || true
